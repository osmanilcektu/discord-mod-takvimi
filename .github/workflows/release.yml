name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} package.json sürümü v${VERSION} ile eşleşmiyor."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build release asset
        shell: bash
        run: |
          mkdir -p dist
          git archive \
            --format=zip \
            --output="dist/discord-mod-takvimi-${GITHUB_REF_NAME}.zip" \
            HEAD

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/discord-mod-takvimi-${GITHUB_REF_NAME}.zip" \
            --title "Discord Moderatör Takvim Botu ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
